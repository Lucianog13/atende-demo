<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendé — Sistema de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ================= LOGIN (pantalla completa) ================= -->
<div id="pantalla-login" class="login-wrap oculto">
  <div class="login-caja">
    <div class="marca">
      <div class="nombre">Atend<span class="accento">é</span></div>
      <div class="lema">Sistema de gestión</div>
    </div>
    <label>Email</label>
    <input id="login-email" type="email" autocomplete="email" placeholder="tu@email.com">
    <label>Contraseña</label>
    <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">
    <div class="error" id="login-error"></div>
    <button id="btn-login">Entrar al sistema</button>
  </div>
</div>

<!-- ================= ALTA DE NEGOCIO ================= -->
<div id="pantalla-alta" class="login-wrap oculto">
  <div class="login-caja">
    <div class="marca">
      <div class="nombre">Atend<span class="accento">é</span></div>
      <div class="lema">Demos de alta tu negocio</div>
    </div>
    <label>Nombre del negocio</label>
    <input id="alta-nombre" type="text" placeholder="Ej. Kiosco El Sol">
    <label>Rubro</label>
    <input id="alta-rubro" type="text" placeholder="Ej. kiosco, ferretería, rotisería">
    <label>WhatsApp del negocio (con código de país)</label>
    <input id="alta-numero" type="text" placeholder="543434065289" inputmode="numeric">
    <div class="error" id="alta-error"></div>
    <div class="ok" id="alta-ok"></div>
    <button id="btn-alta">Crear negocio</button>
    <button class="secundario" id="btn-alta-salir">Volver</button>
  </div>
</div>

<!-- ================= SISTEMA ================= -->
<div id="sistema" class="sistema oculto">
  <aside class="sidebar">
    <div class="marca-side">
      <div class="nombre">Atend<span class="accento">é</span></div>
    </div>
    <nav class="menu" id="menu">
      <a href="#/inicio" data-vista="inicio">🏠 Inicio</a>
      <a href="#/pedidos" data-vista="pedidos">🧾 Pedidos</a>
      <a href="#/catalogo" data-vista="catalogo">📦 Catálogo</a>
      <a href="#/stock" data-vista="stock">📉 Stock</a>
      <a href="#/caja" data-vista="caja">💰 Caja</a>
      <a href="#/cobros" data-vista="cobros">💳 Cobros</a>
      <a href="#/clientes" data-vista="clientes">👥 Clientes</a>
      <a href="#/empleados" data-vista="empleados">🪪 Empleados</a>
      <a href="#/configuracion" data-vista="configuracion">⚙️ Configuración</a>
    </nav>
  </aside>

  <div class="contenido">
    <header class="topbar">
      <div>
        <div class="topbar-negocio" id="tb-negocio"></div>
        <div class="topbar-sub" id="tb-sub"></div>
      </div>
      <div class="topbar-der">
        <span class="pill" id="tb-bot"></span>
        <span class="tb-usuario" id="tb-usuario"></span>
        <button class="btn-ghost" id="btn-salir">Salir</button>
      </div>
    </header>
    <main id="vista" class="vista"></main>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
