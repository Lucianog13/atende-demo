<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Agendá tu Turno / Consulta</title>

  <!-- Tailwind CSS (CDN, sin build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Colores propios: verde WhatsApp como acento
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wa: "#25D366",
            "wa-oscuro": "#1DA851",
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-[100dvh] bg-zinc-950 font-sans text-zinc-100 antialiased [color-scheme:dark]">
  <!-- Resplandor decorativo sutil arriba -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-x-0 top-0 h-64 bg-gradient-to-b from-wa/10 to-transparent"></div>

  <main class="relative mx-auto flex min-h-[100dvh] w-full max-w-md flex-col justify-center px-4 py-8 sm:py-12">
    <!-- Encabezado -->
    <header class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-emerald-400 to-green-600 shadow-lg shadow-green-500/20">
        <!-- Ícono de calendario -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-7 w-7 text-zinc-950">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">Agendá tu Turno / Consulta</h1>
      <p class="mt-2 text-sm text-zinc-400">Completá tus datos y te contactamos por WhatsApp.</p>
    </header>

    <!-- Formulario -->
    <section class="rounded-3xl border border-white/10 bg-zinc-900 p-6 shadow-2xl shadow-black/50">
      <form id="formulario-turno" class="space-y-5">
        <!-- 1) Nombre y apellido -->
        <div>
          <label for="nombre" class="mb-1.5 block text-sm font-medium text-zinc-300">
            Nombre y apellido <span class="text-zinc-500">*</span>
          </label>
          <input id="nombre" name="nombre" type="text" required autocomplete="name" maxlength="80"
            placeholder="Ej.: Juan Pérez"
            class="w-full rounded-xl border border-white/10 bg-zinc-950/60 px-4 py-3 text-base placeholder-zinc-600 outline-none transition focus:border-wa focus:ring-2 focus:ring-wa/30" />
        </div>

        <!-- 2) Servicio deseado -->
        <div>
          <label for="servicio" class="mb-1.5 block text-sm font-medium text-zinc-300">
            Servicio deseado <span class="text-zinc-500">*</span>
          </label>
          <div class="relative">
            <select id="servicio" name="servicio" required
              class="w-full appearance-none rounded-xl border border-white/10 bg-zinc-950/60 px-4 py-3 pr-10 text-base text-zinc-100 outline-none transition focus:border-wa focus:ring-2 focus:ring-wa/30">
              <option value="" disabled selected>Elegí un servicio…</option>
              <!-- Servicios de ejemplo: editar acá los del negocio -->
              <option value="opcion_a">Opción A</option>
              <option value="opcion_b">Opción B</option>
              <option value="opcion_c">Opción C</option>
            </select>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
              class="pointer-events-none absolute right-3 top-1/2 h-5 w-5 -translate-y-1/2 text-zinc-500">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
            </svg>
          </div>
        </div>

        <!-- 3) Fecha y horario preferido -->
        <div>
          <label for="fecha-hora" class="mb-1.5 block text-sm font-medium text-zinc-300">
            Fecha y horario preferido <span class="text-zinc-500">*</span>
          </label>
          <input id="fecha-hora" name="fecha-hora" type="datetime-local" required
            class="w-full rounded-xl border border-white/10 bg-zinc-950/60 px-4 py-3 text-base outline-none transition focus:border-wa focus:ring-2 focus:ring-wa/30" />
        </div>

        <!-- 4) Notas o comentarios -->
        <div>
          <label for="notas" class="mb-1.5 block text-sm font-medium text-zinc-300">
            Notas o comentarios <span class="text-zinc-500">(opcional)</span>
          </label>
          <textarea id="notas" name="notas" rows="3" maxlength="300"
            placeholder="Contanos brevemente qué necesitás…"
            class="w-full resize-none rounded-xl border border-white/10 bg-zinc-950/60 px-4 py-3 text-base placeholder-zinc-600 outline-none transition focus:border-wa focus:ring-2 focus:ring-wa/30"></textarea>
        </div>

        <!-- Botón principal -->
        <button type="submit"
          class="group flex w-full items-center justify-center gap-2.5 rounded-xl bg-wa px-4 py-3.5 text-base font-semibold text-zinc-950 shadow-lg shadow-wa/25 transition hover:bg-wa-oscuro active:scale-[0.98]">
          <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.297-.497.1-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
          Confirmar y Enviar por WhatsApp
        </button>
        <p class="text-center text-xs text-zinc-500">Al confirmar se abre WhatsApp con tu solicitud lista para enviar.</p>
      </form>
    </section>
  </main>

  <script>
    /* ============================================================
       Agendador de turnos — lógica (JavaScript vanilla, sin librerías)
       ============================================================ */

    // Número de WhatsApp que recibe las solicitudes (formato internacional, sin "+")
    const NUMERO_WHATSAPP = "5493434065289";

    const formulario = document.getElementById("formulario-turno");
    const campoFecha = document.getElementById("fecha-hora");

    // El picker de fecha no deja elegir un momento ya pasado
    // (datetime-local espera "AAAA-MM-DDTHH:MM" en hora LOCAL)
    function formatearISO_local(fecha) {
      const desfase = fecha.getTimezoneOffset() * 60000; // minutos → milisegundos
      return new Date(fecha.getTime() - desfase).toISOString().slice(0, 16);
    }
    campoFecha.min = formatearISO_local(new Date());

    // "2026-08-25T15:30" → "martes 25 de agosto de 2026, 15:30"
    function formatearFechaHora(valor) {
      const opciones = {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      };
      return new Intl.DateTimeFormat("es-AR", opciones).format(new Date(valor));
    }

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const servicio = document.getElementById("servicio").value;
      const fechaHora = document.getElementById("fecha-hora").value;
      const notas = document.getElementById("notas").value.trim();

      // Nombre legible del servicio seleccionado
      const nombreServicio =
        document.querySelector(`#servicio option[value="${servicio}"]`)?.textContent ?? servicio;

      // Armado del mensaje (los * * ponen negrita en WhatsApp)
      const lineas = [
        "¡Hola! Quiero agendar un turno / consulta 📅",
        "",
        `👤 *Nombre:* ${nombre}`,
        `🛠 *Servicio:* ${nombreServicio}`,
        `📅 *Fecha y horario:* ${formatearFechaHora(fechaHora)}`,
      ];
      if (notas) lineas.push(`📝 *Notas:* ${notas}`);

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(lineas.join("\n"))}`;

      // Abre WhatsApp en pestaña nueva (en el celular, abre la app directo)
      const ventana = window.open(url, "_blank", "noopener");
      if (!ventana) window.location.href = url; // por si el navegador bloquea la pestaña
    });
  </script>
</body>
</html>
